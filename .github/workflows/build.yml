name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          unzip -o WebPet.zip 2>&1 | tail -2
          cd WebPet
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          if ! gradle assembleDebug --no-daemon 2>&1 | tee ../log.txt; then
            grep -E "^e: |error:|What went wrong|Could not|Failed|> " ../log.txt | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WebPet-apk
          path: WebPet/app/build/outputs/apk/debug/app-debug.apk
